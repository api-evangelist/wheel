  detail: >-
    Wheel's developer portal at developers.wheel.com is a Netlify site behind
    site-wide password protection that answers HTTP 401 "Password Protection" to
    every path — including /openapi.json, /llms.txt and /.well-known/* — and its
    API Terms of Use §3 require an approved organizational agreement before
    Access Credentials are issued, so the contract is unreadable without a
    signed customer relationship.
