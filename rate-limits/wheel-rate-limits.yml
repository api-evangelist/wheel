notes: >-
  Wheel asserts that rate limits exist and that they are set per-customer
  "based on anticipated usage", but publishes no numbers, no windows, no burst
  allowance, no response headers (X-RateLimit-*, RateLimit-*, Retry-After) and
  no status code on exhaustion. A limit that is only discoverable after signing
  an agreement is not a runtime signal an agent can plan against. limit_count is
  0 because nothing quantitative is published; no RateLimits pointer is wired in
  apis.yml, since asserting one would credit Wheel with a published limit
  surface it does not have.
